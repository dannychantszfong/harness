[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-agent-harness"
version = "0.1.0"
description = "A production harness for long-running Claude agents with context resets, GAN-style evaluation, and multi-session progress tracking"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
# Agentic runners — install the relevant CLI separately (not via pip).
# The sdk runner uses the frozen claude-code-sdk 0.0.25 (ADR-014); the
# migration to claude-agent-sdk is planned for 1.1.
sdk = [
    "claude-code-sdk==0.0.25",
]

# API runners — install the provider SDK you want
openai = [
    "openai>=1.30",             # also used for OpenRouter
]
gemini = [
    "google-generativeai>=0.8",
]

# Install everything for all providers
all-providers = [
    "claude-code-sdk==0.0.25",
    "openai>=1.30",
    "google-generativeai>=0.8",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.6",
    "build>=1.0",
]

[project.scripts]
harness = "harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "packaging: builds a wheel and installs it into a temporary virtualenv (slow)",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Defaults (E4/E7/E9/F) + warnings + naive-datetime checks (P-24).
select = ["E4", "E7", "E9", "F", "W", "DTZ"]
